<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mundo Colchonetas | Premium Fitness</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #8e44ad; 
            --dark: #000000; 
            --white: #ffffff;
            --slate-500: #64748b;
            --slate-100: #f4f4f5;
            --border: #e2e8f0;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #ffffff; color: #000000; line-height: 1.6; }
        .container { max-width: 1300px; margin: 0 auto; padding: 0 20px; }

        header {
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid var(--border);
            padding: 0.7rem 0;
            position: sticky; top: 0; z-index: 1000;
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo-svg { height: 35px; width: auto; display: block; }

        .hero-banner {
            margin: 15px 0 30px;
            background: radial-gradient(circle at 50% 50%, #1e0b36 0%, #000000 100%);
            border-radius: var(--radius-lg);
            height: 250px;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        .search-container { margin-bottom: 20px; position: relative; }
        .search-input { 
            width: 100%; padding: 15px 20px 15px 50px; border-radius: 99px; 
            border: 1px solid var(--border); background: var(--slate-100);
            font-size: 16px; outline: none;
        }
        .search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--slate-500); }

        .category-nav { display: flex; gap: 8px; margin-bottom: 25px; overflow-x: auto; padding: 10px 5px; }
        .cat-btn {
            padding: 10px 20px; border-radius: 99px; border: 1px solid var(--border);
            background: white; cursor: pointer; font-weight: 600; white-space: nowrap;
        }
        .cat-btn.active { background: black; color: white; }

        .bento-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 20px; 
            margin-bottom: 60px; 
        }
        .product-card { 
            background: white; 
            border-radius: var(--radius-lg); 
            border: 1px solid var(--border); 
            padding: 20px; 
            cursor: pointer;
        }
        .product-card:hover { 
            transform: translateY(-5px); 
            box-shadow: var(--shadow); 
        }
        
        .product-image-container { 
            width: 100%; 
            height: 260px; 
            background: var(--slate-100); 
            border-radius: var(--radius-md); 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }
        .product-image-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .current-price { 
            font-size: 1.6rem; 
            font-weight: 800; 
            color: var(--primary); 
        }

        .btn-add-cart {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
        }

        .cart-sidebar { position: fixed; top: 0; right: -100%; width: 100%; max-width: 420px; height: 100vh; background: white; z-index: 2000; padding: 25px; transition: all 0.3s; }
        .cart-sidebar.active { right: 0; }

        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index: 2500; padding: 15px; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 900px; padding: 30px; border-radius: var(--radius-lg); max-height: 90vh; overflow-y: auto; }

        .admin-panel { background: white; border: 2px solid black; border-radius: var(--radius-lg); padding: 25px; margin: 30px 0; display: none; }
        .admin-panel.visible { display: block; }
        .form-input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: 1px solid var(--border); font-size: 16px; }

        #notification { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(150px); background: black; color: white; padding: 12px 30px; border-radius: 99px; z-index: 3000; transition: all 0.3s; }
        .wa-float { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: #25D366; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; z-index: 900; text-decoration: none; }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <div style="font-weight: 900; font-size: 1.5rem;">MUNDO COLCHONETAS</div>
            <button class="cat-btn" onclick="toggleCart()">
                🛒 <span id="header-cart-count">0</span>
            </button>
        </div>
    </header>

    <main class="container">
        <section class="hero-banner">
            <div style="text-align: center; color: white;">
                <div style="font-size: 2rem; font-weight: 300;">MUNDO</div>
                <div style="font-size: 2.5rem; font-weight: 800;">COLCHONETAS</div>
            </div>
        </section>

        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="product-search" class="search-input" placeholder="Buscar productos..." oninput="handleSearch()">
        </div>

        <div class="category-nav" id="categories-container"></div>
        
        <div class="bento-grid" id="products-container">
             <p style="text-align:center; grid-column: 1/-1; padding: 50px;">Cargando catálogo...</p>
        </div>

        <div style="text-align: center; margin: 40px 0;">
            <button class="cat-btn" onclick="checkAdminAccess()">Acceso Administración</button>
        </div>

        <section class="admin-panel" id="admin-panel">
            <h3>Panel de Control</h3>
            
            <!-- CONFIGURACIÓN DE GOOGLE SHEETS -->
            <div style="margin-top:20px; padding: 20px; background: #f9f9f9; border-radius: 10px;">
                <h4>📊 Configuración de Estadísticas</h4>
                <label style="font-weight:700; font-size:0.8rem;">URL de Google Sheets para Estadísticas:</label>
                <input type="text" id="stats-url" class="form-input" placeholder="Pega aquí la URL de tu Apps Script">
                <button class="cat-btn active" style="margin-top:10px; width:100%;" onclick="saveStatsUrl()">Guardar URL</button>
                <button class="cat-btn" style="margin-top:10px; width:100%;" onclick="testConnection()">Probar Conexión</button>
            </div>
            
            <!-- ESTADÍSTICAS -->
            <div style="margin-top: 30px;">
                <h4>📈 Estadísticas Locales</h4>
                <div id="stats-display"></div>
            </div>
        </section>
    </main>

    <!-- CARRITO -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2>Tu Carrito</h2>
            <button onclick="toggleCart()" style="background:none; border:none; font-size:2rem; cursor:pointer;">&times;</button>
        </div>
        <div id="cart-items" style="flex:1; overflow-y:auto;"></div>
        
        <div style="margin-top:20px;">
            <label style="font-weight:700;">Nombre Completo *</label>
            <input type="text" id="customer-name" class="form-input" placeholder="Tu nombre">
        </div>

        <div style="padding-top:15px; border-top:2px solid black; margin-top:20px;">
            <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1.4rem;"><span>Total</span><span id="cart-total">$0</span></div>
            <button class="cat-btn active" style="width:100%; padding:18px; margin-top:10px;" onclick="checkout()">Enviar Pedido</button>
        </div>
    </div>

    <!-- MODAL DETALLE -->
    <div class="modal" id="detail-modal">
        <div class="modal-content">
            <span onclick="closeModal('detail-modal')" style="position:absolute; top:15px; right:20px; font-size:2rem; cursor:pointer;">&times;</span>
            <div id="detail-content"></div>
        </div>
    </div>

    <!-- MODAL LOGIN -->
    <div class="modal" id="login-modal">
        <div class="modal-content" style="max-width:400px; text-align:center;">
            <h3>Login Admin</h3>
            <input type="text" id="login-u" placeholder="Usuario" class="form-input">
            <input type="password" id="login-p" placeholder="Contraseña" class="form-input">
            <button class="cat-btn active" style="width:100%; margin-top:20px;" onclick="login()">Entrar</button>
        </div>
    </div>

    <div id="notification">¡Añadido!</div>
    <a href="https://wa.me/5491168705261" class="wa-float" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <script>
        // CONFIGURACIÓN
        const CONFIG = {
            ADMIN: { user: "admin", pass: "mundo123" },
            KEY: "mundo_colchonetas_products",
            SALES_KEY: "mundo_colchonetas_ventas",
            VISITORS_KEY: "mundo_colchonetas_visitors",
            PRODUCT_VIEWS_KEY: "mundo_colchonetas_product_views",
            MASTER_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQX_MteY9z1Of-MIimoruabnLSCY2p1mMDl0RvYeDWivYTfXljryTikNsCGM3yFdF-PcoWo2Zyb5EiS/pub?gid=0&single=true&output=csv",
            SHEETS_WEBAPP_URL: "https://script.google.com/macros/s/AKfycbwhqmZQdheEmlcQfpNRbIGMHXSXbYXhPc5ySN56Q6QutgdMG3K6Kqm_8dD9PRw2E-InuQ/exec"
        };
        
        let products = [], cart = [], currentCategory = 'todos', isAdminLoggedIn = false;

        // ==================== FUNCIONES DE VISITAS ====================
        function trackVisitor() {
            const today = new Date().toLocaleDateString('es-AR');
            let visitorsData = JSON.parse(localStorage.getItem(CONFIG.VISITORS_KEY)) || {
                total: 0,
                today: 0,
                todayDate: today,
                history: []
            };
            
            if (visitorsData.todayDate !== today) {
                visitorsData.today = 0;
                visitorsData.todayDate = today;
            }
            
            visitorsData.total++;
            visitorsData.today++;
            visitorsData.history.push({
                date: today,
                time: new Date().toLocaleTimeString('es-AR')
            });
            
            localStorage.setItem(CONFIG.VISITORS_KEY, JSON.stringify(visitorsData));
            sendVisitToGoogleSheets();
        }

        function trackProductView(clave) {
            let viewsData = JSON.parse(localStorage.getItem(CONFIG.PRODUCT_VIEWS_KEY)) || {};
            if (!viewsData[clave]) viewsData[clave] = 0;
            viewsData[clave]++;
            localStorage.setItem(CONFIG.PRODUCT_VIEWS_KEY, JSON.stringify(viewsData));
            
            const product = products.find(p => p.clave === clave);
            if (product) {
                sendProductViewToGoogleSheets(clave, product.nombre);
            }
        }

        // ==================== ENVÍO A GOOGLE SHEETS ====================
        function getStatsUrl() {
            return localStorage.getItem('stats_url') || CONFIG.SHEETS_WEBAPP_URL;
        }

        function saveStatsUrl() {
            const url = document.getElementById('stats-url').value.trim();
            if (url) {
                localStorage.setItem('stats_url', url);
                alert('✅ URL guardada correctamente');
            }
        }

        function testConnection() {
            const url = getStatsUrl();
            fetch(url)
                .then(response => response.text())
                .then(data => {
                    alert('✅ Conexión exitosa. El Apps Script está funcionando.');
                })
                .catch(error => {
                    alert('❌ Error de conexión. Verifica la URL del Apps Script.');
                });
        }

        function sendVisitToGoogleSheets() {
            const url = getStatsUrl();
            const data = {
                tipo: "visita",
                fecha: new Date().toLocaleDateString('es-AR'),
                hora: new Date().toLocaleTimeString('es-AR')
            };
            
            fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(error => console.log("Error enviando visita:", error));
        }

        function sendProductViewToGoogleSheets(clave, nombre) {
            const url = getStatsUrl();
            const data = {
                tipo: "producto",
                clave: clave,
                nombre: nombre,
                fecha: new Date().toLocaleDateString('es-AR'),
                hora: new Date().toLocaleTimeString('es-AR')
            };
            
            fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(error => console.log("Error enviando vista:", error));
        }

        // ==================== CARGAR PRODUCTOS ====================
        function parseCSV(text) {
            const rows = [];
            let row = [];
            let cell = '';
            let inQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                
                if (char === '"' && inQuotes) {
                    inQuotes = false;
                } else if (char === '"' && !inQuotes) {
                    inQuotes = true;
                } else if (char === ',' && !inQuotes) {
                    row.push(cell);
                    cell = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (cell !== '' || row.length > 0) {
                        row.push(cell);
                        rows.push(row);
                        row = [];
                        cell = '';
                    }
                } else {
                    cell += char;
                }
            }
            
            if (cell !== '' || row.length > 0) {
                row.push(cell);
                rows.push(row);
            }
            
            return rows;
        }

        async function loadProducts() {
            try {
                const response = await fetch(CONFIG.MASTER_URL);
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                
                products = rows.slice(1).map(cols => {
                    if (cols.length < 6) return null;
                    const precioBase = parseFloat(cols[5]) || 0;
                    const descuento = parseFloat(cols[10]) || 0;
                    
                    return {
                        clave: cols[0],
                        nombre: cols[2],
                        stock: cols[3],
                        precio: precioBase,
                        categoria: cols[7] || 'Otros',
                        descripcion: cols[8] || '',
                        oferta: cols[9] === 'SI',
                        descuento: descuento,
                        precioOferta: descuento > 0 ? Math.round(precioBase * (1 - descuento/100)) : precioBase,
                        fotos: cols[11] ? cols[11].split(',').map(f => f.trim()) : []
                    };
                }).filter(p => p !== null && p.clave !== "");
                
                localStorage.setItem(CONFIG.KEY, JSON.stringify(products));
                renderAll();
            } catch (error) {
                console.error("Error cargando productos:", error);
                // Intentar cargar desde localStorage
                const local = localStorage.getItem(CONFIG.KEY);
                if (local) {
                    products = JSON.parse(local);
                    renderAll();
                }
            }
        }

        // ==================== RENDERIZAR ====================
        function renderAll() {
            renderCategories();
            renderProducts();
        }

        function renderCategories() {
            const container = document.getElementById('categories-container');
            const cats = ['todos', ...new Set(products.map(p => p.categoria.toLowerCase()))];
            
            container.innerHTML = cats.map(c => `
                <button class="cat-btn ${currentCategory === c ? 'active' : ''}" onclick="filterCat('${c}')">
                    ${c.toUpperCase()}
                </button>
            `).join('');
        }

        function renderProducts() {
            const container = document.getElementById('products-container');
            let filtered = products;
            
            if (currentCategory !== 'todos') {
                filtered = products.filter(p => p.categoria.toLowerCase() === currentCategory);
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center; padding:50px;">No hay productos.</p>';
                return;
            }
            
            container.innerHTML = filtered.map(p => {
                const precioFinal = p.oferta ? p.precioOferta : p.precio;
                const stock = parseInt(p.stock) || 0;
                
                return `
                <div class="product-card">
                    <div class="product-image-container" onclick="openDetail('${p.clave}')">
                        ${p.fotos[0] ? `<img src="${p.fotos[0]}" loading="lazy">` : '📦'}
                    </div>
                    <div onclick="openDetail('${p.clave}')">
                        <p style="font-size:0.75rem; color:#8e44ad; font-weight:700;">${p.categoria.toUpperCase()}</p>
                        <h3 style="font-size:1.1rem; margin:5px 0;">${p.nombre}</h3>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span class="current-price">$${precioFinal.toLocaleString()}</span>
                            ${stock > 0 ? `<span style="color:green; font-size:0.8rem;">✓ ${stock}</span>` : '<span style="color:red;">Sin stock</span>'}
                        </div>
                    </div>
                    ${stock > 0 ? `
                        <button class="btn-add-cart" onclick="addToCart('${p.clave}')" style="margin-top:10px;">
                            🛒
                        </button>
                    ` : ''}
                </div>`;
            }).join('');
        }

        function filterCat(c) {
            currentCategory = c;
            renderProducts();
        }

        function handleSearch() {
            const query = document.getElementById('product-search').value.toLowerCase();
            const filtered = products.filter(p => 
                p.nombre.toLowerCase().includes(query) || 
                p.categoria.toLowerCase().includes(query)
            );
            
            const container = document.getElementById('products-container');
            container.innerHTML = filtered.map(p => {
                const precioFinal = p.oferta ? p.precioOferta : p.precio;
                return `
                <div class="product-card">
                    <div class="product-image-container" onclick="openDetail('${p.clave}')">
                        ${p.fotos[0] ? `<img src="${p.fotos[0]}">` : '📦'}
                    </div>
                    <h3>${p.nombre}</h3>
                    <span class="current-price">$${precioFinal.toLocaleString()}</span>
                </div>`;
            }).join('');
        }

        // ==================== DETALLE ====================
        function openDetail(clave) {
            trackProductView(clave);
            const p = products.find(i => i.clave === clave);
            if (!p) return;
            
            const precioFinal = p.oferta ? p.precioOferta : p.precio;
            
            document.getElementById('detail-content').innerHTML = `
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px;">
                    <div style="height:400px; background:#f4f4f5; display:flex; align-items:center; justify-content:center;">
                        ${p.fotos[0] ? `<img src="${p.fotos[0]}" style="max-width:100%; max-height:100%;">` : '📦'}
                    </div>
                    <div>
                        <h2 style="font-size:2rem; font-weight:800;">${p.nombre}</h2>
                        <p style="color:#64748b;">${p.descripcion || ''}</p>
                        <div style="font-size:2.5rem; font-weight:800; color:#8e44ad; margin:20px 0;">
                            $${precioFinal.toLocaleString()}
                        </div>
                        <button class="cat-btn active" style="width:100%; padding:15px;" onclick="addToCart('${p.clave}')">
                            Añadir al Carrito
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('detail-modal').classList.add('active');
        }

        // ==================== CARRITO ====================
        function addToCart(clave) {
            const p = products.find(i => i.clave === clave);
            if (!p) return;
            
            const exist = cart.find(i => i.clave === clave);
            if (exist) {
                exist.qty++;
            } else {
                cart.push({...p, qty: 1});
            }
            updateCart();
            showNotification('¡Producto añadido!');
        }

        function updateCart() {
            const container = document.getElementById('cart-items');
            let total = 0;
            
            container.innerHTML = cart.map(item => {
                const precio = item.oferta ? item.precioOferta : item.precio;
                total += precio * item.qty;
                return `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #eee;">
                        <div>
                            <strong>${item.nombre}</strong>
                            <p>$${precio.toLocaleString()} x ${item.qty}</p>
                        </div>
                        <button onclick="removeFromCart('${item.clave}')" style="color:red; border:none; background:none; cursor:pointer;">🗑️</button>
                    </div>
                `;
            }).join('');
            
            document.getElementById('cart-total').innerText = `$${total.toLocaleString()}`;
            document.getElementById('header-cart-count').innerText = cart.reduce((acc, i) => acc + i.qty, 0);
        }

        function removeFromCart(clave) {
            cart = cart.filter(i => i.clave !== clave);
            updateCart();
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('active');
        }

        // ==================== CHECKOUT ====================
        function checkout() {
            if (cart.length === 0) return;
            
            const nombre = document.getElementById('customer-name').value.trim();
            if (!nombre) {
                alert('Por favor ingresa tu nombre');
                return;
            }
            
            let mensaje = `¡Hola Mundo Colchonetas! 🪐\nCliente: ${nombre}\n\n📦 PEDIDO:\n`;
            let total = 0;
            
            cart.forEach(item => {
                const precio = item.oferta ? item.precioOferta : item.precio;
                const subtotal = precio * item.qty;
                total += subtotal;
                mensaje += `• ${item.nombre} x${item.qty} = $${subtotal.toLocaleString()}\n`;
            });
            
            mensaje += `\n💰 TOTAL: $${total.toLocaleString()}`;
            
            // Guardar venta
            const venta = {
                fecha: new Date().toLocaleString('es-AR'),
                cliente: nombre,
                items: cart,
                total: total
            };
            
            let ventas = JSON.parse(localStorage.getItem(CONFIG.SALES_KEY)) || [];
            ventas.push(venta);
            localStorage.setItem(CONFIG.SALES_KEY, JSON.stringify(ventas));
            
            // Limpiar carrito
            cart = [];
            updateCart();
            toggleCart();
            document.getElementById('customer-name').value = '';
            
            // Abrir WhatsApp
            window.open(`https://wa.me/5491168705261?text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        // ==================== ADMIN ====================
        function checkAdminAccess() {
            if (isAdminLoggedIn) {
                document.getElementById('admin-panel').classList.toggle('visible');
                showStats();
            } else {
                document.getElementById('login-modal').classList.add('active');
            }
        }

        function login() {
            const u = document.getElementById('login-u').value;
            const p = document.getElementById('login-p').value;
            
            if (u === CONFIG.ADMIN.user && p === CONFIG.ADMIN.pass) {
                isAdminLoggedIn = true;
                document.getElementById('login-modal').classList.remove('active');
                document.getElementById('admin-panel').classList.add('visible');
                showStats();
            } else {
                alert('Usuario o contraseña incorrectos');
            }
        }

        function showStats() {
            const visitors = JSON.parse(localStorage.getItem(CONFIG.VISITORS_KEY)) || {total: 0, today: 0};
            const views = JSON.parse(localStorage.getItem(CONFIG.PRODUCT_VIEWS_KEY)) || {};
            const ventas = JSON.parse(localStorage.getItem(CONFIG.SALES_KEY)) || [];
            
            document.getElementById('stats-display').innerHTML = `
                <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:15px; margin-top:15px;">
                    <div style="background:#f4f4f5; padding:15px; border-radius:10px; text-align:center;">
                        <div style="font-size:2rem; font-weight:800; color:#8e44ad;">${visitors.total || 0}</div>
                        <div>Visitas totales</div>
                    </div>
                    <div style="background:#f4f4f5; padding:15px; border-radius:10px; text-align:center;">
                        <div style="font-size:2rem; font-weight:800; color:#8e44ad;">${visitors.today || 0}</div>
                        <div>Visitas hoy</div>
                    </div>
                    <div style="background:#f4f4f5; padding:15px; border-radius:10px; text-align:center;">
                        <div style="font-size:2rem; font-weight:800; color:#8e44ad;">${ventas.length}</div>
                        <div>Ventas</div>
                    </div>
                </div>
                <button class="cat-btn" style="margin-top:15px;" onclick="exportStats()">Exportar CSV</button>
            `;
        }

        function exportStats() {
            const visitors = JSON.parse(localStorage.getItem(CONFIG.VISITORS_KEY)) || {};
            const views = JSON.parse(localStorage.getItem(CONFIG.PRODUCT_VIEWS_KEY)) || {};
            
            let csv = "Tipo,Fecha,Hora,Dato\n";
            
            visitors.history?.forEach(v => {
                csv += `Visita,${v.date},${v.time},\n`;
            });
            
            Object.entries(views).forEach(([clave, count]) => {
                const p = products.find(prod => prod.clave === clave);
                csv += `Producto visto,${p?.nombre || clave},${count} vistas,\n`;
            });
            
            const blob = new Blob([csv], {type: 'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'estadisticas.csv';
            a.click();
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function showNotification(msg) {
            const n = document.getElementById('notification');
            n.innerText = msg;
            n.style.transform = "translateX(-50%) translateY(0)";
            setTimeout(() => n.style.transform = "translateX(-50%) translateY(150px)", 2000);
        }

        // ==================== INICIALIZAR ====================
        window.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            trackVisitor();
        });
    </script>
</body>
</html>
