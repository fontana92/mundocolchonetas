    <style>

        header {
            background: rgba(255, 255, 255, 0.85);

        }

        .stars {

            background-image: radial-gradient(white 1px, transparent 1px);

        .search-container { margin-bottom: 20px; position: relative; }

        .chatbot-toggle { position: fixed; bottom: 100px; right: 25px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; z-index: 900; box-shadow: 0 10px 30px rgba(142, 68, 173, 0.4); cursor: pointer; border: none; transition: var(--transition); }
        .chatbot-container { position: fixed; bottom: 170px; right: 25px; width: 350px; height: 500px; background: white; border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.2); z-index: 899; display: none; flex-direction: column; overflow: hidden; border: 3px solid var(--primary); }

        .chatbot-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .chatbot-input { display: flex; padding: 15px; border-top: 1px solid var(--border); gap: 10px; }
        .chatbot-input input { flex: 1; padding: 12px 15px; border: 1px solid var(--border); border-radius: 25px; font-size: 0.9rem; outline: none; }
        .chatbot-input button { background: var(--primary); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .share-float { position: fixed; bottom: 25px; left: 25px; width: 60px; height: 60px; background: linear-gradient(45deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; z-index: 900; box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); cursor: pointer; border: none; transition: var(--transition); }
        .share-container { position: fixed; bottom: 100px; left: 25px; background: white; border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.2); z-index: 899; display: none; flex-direction: column; overflow: hidden; border: 3px solid var(--primary); width: 300px; }
        .share-container.active { display: flex; }
        .share-header { background: var(--primary); color: white; padding: 15px 20px; font-weight: 700; font-size: 0.9rem; }
        .share-buttons { padding: 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .share-button { display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--slate-100); border: 1px solid var(--border); border-radius: 15px; padding: 15px 10px; cursor: pointer; transition: var(--transition); text-decoration: none; color: var(--dark); }
        .share-button:hover { background: var(--primary); color: white; transform: translateY(-3px); }
    </style>
</head>

    <script>
        const CONFIG = {
            ADMIN: { user: "admin", pass: "mundo123" },
            KEY: "mundo_colch_vFinal_Robust",
            SALES_KEY: "mundo_colchonetas_ventas",
            VISITORS_KEY: "mundo_colchonetas_visitors",
            MASTER_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQX_MteY9z1Of-MIimoruabnLSCY2p1mMDl0RvYeDWivYTfXljryTikNsCGM3yFdF-PcoWo2Zyb5EiS/pub?gid=0&single=true&output=csv",
            // PEGA ACÁ TU URL DE APPS SCRIPT
            SALES_SHEET_URL: "https://script.google.com/macros/s/AKfycbwR7fLmZglTQJz5wN3WgAvWhfiC2xTHiH482liZWUB4dH613GobiDMbj9f0rAlPEbFD4Q/exec

" 
        };

        const SHIPPING_RATES = { "1629": 8000, "1635": 8000, "1669": 10000 };
        let products = [], cart = [], currentCategory = 'todos', isAdminLoggedIn = false, shippingFee = 0, searchQuery = "";
        const norm = (str) => str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";

        // REGISTRO DE VENTA
        function registerSale(customerName, cp) {
            const totalAmount = cart.reduce((acc, item) => acc + ((item.oferta ? item.precioOferta : item.precio) * item.qty), 0) + shippingFee;
            const itemsSummary = cart.map(item => `${item.nombre} (x${item.qty})`).join(", ");
            const sale = { customerName, postalCode: cp, items: itemsSummary, total: `$${totalAmount.toLocaleString()}` };

            if (CONFIG.SALES_SHEET_URL !== "TU_URL_DE_APPS_SCRIPT_AQUI") {
                fetch(CONFIG.SALES_SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(sale) });
            }

            let history = JSON.parse(localStorage.getItem(CONFIG.SALES_KEY)) || [];
            history.push({ date: new Date().toLocaleString(), ...sale });
            localStorage.setItem(CONFIG.SALES_KEY, JSON.stringify(history));
            cart = []; updateCartUI();
        }

        // CARGA DE DATOS ORIGINAL
        async function syncWithExcel(silent = false) {
            const urlInput = document.getElementById('excel-url').value || CONFIG.MASTER_URL;
            try {
                const res = await fetch(urlInput.includes('pub?') ? `${urlInput.split('?')[0]}?output=csv&cache=${Date.now()}` : CONFIG.MASTER_URL);
                const csvText = await res.text(); const rows = parseCSV(csvText);
                products = rows.slice(1).map(cols => {
                    if (cols.length < 6) return null;
                    const pBase = parseFloat(cols[5]) || 0; const desc = parseFloat(cols[10]) || 0;
                    return { clave: cols[0], nombre: cols[2], stock: cols[3], precio: pBase, categoria: cols[7] || 'Otros', descripcion: cols[8] || '', oferta: cols[9] === 'SI', descuento: desc, precioOferta: desc > 0 ? Math.round(pBase * (1 - desc/100)) : pBase, fotos: cols[11] ? cols[11].split(',').map(f => f.trim()) : [] };
                }).filter(p => p !== null && p.clave !== "");
                localStorage.setItem(CONFIG.KEY, JSON.stringify(products)); renderAll();
            } catch (e) { if(!silent) alert("Error"); }
        }

        function parseCSV(text) { const rows = []; let row = []; let cell = ''; let inQuotes = false; for (let i = 0; i < text.length; i++) { const char = text[i]; if (char === '"' && text[i+1] === '"') { cell += '"'; i++; } else if (char === '"') inQuotes = !inQuotes; else if (char === ',' && !inQuotes) { row.push(cell); cell = ''; } else if ((char === '\r' || char === '\n') && !inQuotes) { if (cell !== '' || row.length > 0) { row.push(cell); rows.push(row); row = []; cell = ''; } } else cell += char; } if (cell !== '' || row.length > 0) { row.push(cell); rows.push(row); } return rows; }
        function renderAll() { renderCategories(); renderProducts(); }
        function renderCategories() { const cats = ['todos', ...new Set(products.map(p => p.categoria.toLowerCase()))]; document.getElementById('categories-container').innerHTML = cats.map(c => `<button class="cat-btn ${currentCategory===c?'active':''}" onclick="filterCat('${c}')">${c.toUpperCase()}</button>`).join(''); }
        function filterCat(c) { currentCategory = c; renderAll(); }
        function handleSearch() { searchQuery = norm(document.getElementById('product-search').value); renderProducts(); }
        function renderProducts() {
            const container = document.getElementById('products-container');
            let filtered = products.filter(p => currentCategory==='todos' || p.categoria.toLowerCase()===currentCategory);
            if (searchQuery) filtered = filtered.filter(p => norm(p.nombre).includes(searchQuery));
            container.innerHTML = filtered.map(p => `<div class="product-card" onclick="openDetail('${p.clave}')"><div class="product-image-container"><img src="${p.fotos[0]}"></div><h3>${p.nombre}</h3><div style="display:flex; justify-content:space-between;"><b>$${(p.oferta?p.precioOferta:p.precio).toLocaleString()}</b><button class="btn-add-circle" onclick="event.stopPropagation(); addToCart('${p.clave}')">+</button></div></div>`).join('');
        }
        function openDetail(clave) { const p = products.find(i => i.clave === clave); document.getElementById('detail-content').innerHTML = `<h2>${p.nombre}</h2><p>${p.descripcion}</p><img src="${p.fotos[0]}" style="width:100%"><button class="cat-btn active" onclick="addToCart('${p.clave}')">Sumar</button>`; document.getElementById('detail-modal').classList.add('active'); }
        function addToCart(clave) { const p = products.find(i => i.clave === clave); const exist = cart.find(i => i.clave === clave); if(exist) exist.qty++; else cart.push({...p, qty: 1}); updateCartUI(); showNotify("Añadido"); }
        function updateCartUI() { let sub = 0; document.getElementById('cart-items').innerHTML = cart.map(i => { const p = i.oferta?i.precioOferta:i.precio; sub+=p*i.qty; return `<div>${i.nombre} x${i.qty}</div>` }).join(''); document.getElementById('cart-total').innerText = `$${(sub+shippingFee).toLocaleString()}`; document.getElementById('header-cart-count').innerText = cart.length; }
        function checkoutViaWhatsApp() { const n = document.getElementById('customer-name').value; registerSale(n, ""); window.open(`https://wa.me/5491168705261?text=Pedido de ${n}`); }
        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function showNotify(m) { const n = document.getElementById('notification'); n.innerText = m; n.style.transform = "translateX(-50%) translateY(0)"; setTimeout(() => n.style.transform = "translateX(-50%) translateY(150px)", 2000); }
        function checkAdminAccess() { document.getElementById('login-modal').classList.add('active'); }
        function login() { if(document.getElementById('login-p').value === "mundo123") { isAdminLoggedIn = true; document.getElementById('login-modal').classList.remove('active'); document.getElementById('admin-panel').classList.add('visible'); } }
        function trackVisitor() {} function showVisitorStats() {} function showSalesReport() {} function toggleChatbot() { document.getElementById('chatbot-container').classList.toggle('active'); } function sendChatbotMessage() {} function toggleShare() {} function calculateShipping() { shippingFee = 8000; updateCartUI(); } function handleChatbotKeypress(e) { if(e.key==='Enter') sendChatbotMessage(); }

        window.addEventListener('DOMContentLoaded', () => { syncWithExcel(true); });
    </script>
</body>
</html>
