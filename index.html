<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mundo Colchonetas | Premium Fitness</title>
    
    <meta name="description" content="Catálogo oficial de Mundo Colchonetas - Calidad premium en fitness.">
    <link rel="icon" type="image/png" href="https://mundocolchonetas.com/favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #8e44ad; 
            --primary-glow: rgba(142, 68, 173, 0.4);
            --dark: #000000; 
            --white: #ffffff;
            --slate-500: #64748b;
            --slate-100: #f4f4f5;
            --border: #e2e8f0;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--white); color: var(--dark); line-height: 1.6; overflow-x: hidden; width: 100%; }
        .container { max-width: 1300px; margin: 0 auto; padding: 0 20px; }

        header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            padding: 0.7rem 0;
            position: sticky; top: 0; z-index: 1000;
        }
        .header-content { display: flex; justify-content: space-between; align-items: center; }
        .logo-svg { height: 35px; width: auto; display: block; }

        .social-header { display: flex; gap: 15px; margin-right: 15px; }
        .social-icon { color: var(--dark); font-size: 1.2rem; transition: var(--transition); text-decoration: none; }
        .social-icon:hover { color: var(--primary); transform: translateY(-2px); }

        .hero-banner {
            margin: 15px 0 30px;
            background: radial-gradient(circle at 50% 50%, #1e0b36 0%, #000000 100%);
            border-radius: var(--radius-lg);
            height: 250px;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden; border: 1px solid #333;
        } 
        @media (min-width: 768px) { .hero-banner { height: 380px; } }

        .stars {
            position: absolute; width: 200%; height: 200%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px; opacity: 0.2;
            animation: space-move 100s linear infinite;
        }
        @keyframes space-move { from { transform: translateY(0); } to { transform: translateY(-50%); } }

        .search-container { margin-bottom: 20px; position: relative; }
        .search-input { 
            width: 100%; padding: 15px 20px 15px 50px; border-radius: 99px; 
            border: 1px solid var(--border); background: var(--slate-100);
            font-size: 16px; outline: none; transition: var(--transition);
        }
        .search-input:focus { background: var(--white); border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
        .search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--slate-500); }

        .category-nav { display: flex; gap: 8px; margin-bottom: 25px; overflow-x: auto; padding: 10px 5px; scrollbar-width: none; }
        .cat-btn {
            padding: 10px 20px; border-radius: 99px; border: 1px solid var(--border);
            background: var(--white); cursor: pointer; font-weight: 600; white-space: nowrap;
            transition: var(--transition); color: var(--dark); font-size: 0.8rem;
        }
        .cat-btn.active { background: var(--dark); color: var(--white); border-color: var(--dark); }

        .bento-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 15px; 
            margin-bottom: 60px; 
            justify-content: center;
        }
        .product-card { background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 15px; transition: var(--transition); display: flex; flex-direction: column; cursor: pointer; position: relative; }
        .product-card:hover { transform: translateY(-8px); box-shadow: var(--shadow); border-color: var(--primary); }
        
        .badge-offer { 
            position: absolute; top: 15px; left: 15px; background: #ff4757; color: white; 
            padding: 4px 12px; border-radius: 99px; font-size: 0.7rem; font-weight: 800; z-index: 5;
        }

        .product-image-container { width: 100%; height: 200px; background: var(--slate-100); border-radius: var(--radius-md); margin-bottom: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .product-image-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .current-price { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
        .btn-add-circle { width: 45px; height: 45px; border-radius: 50%; background: var(--dark); color: var(--white); display: flex; align-items: center; justify-content: center; border: none; }

        .cart-sidebar { position: fixed; top: 0; right: -100%; width: 100%; max-width: 420px; height: 100vh; background: var(--white); z-index: 2000; transition: var(--transition); padding: 25px; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.1); border-left: 5px solid var(--dark); }
        .cart-sidebar.active { right: 0; }

        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display:none; align-items:center; justify-content:center; z-index: 2500; }
        .modal.active { display: flex; }
        .modal-content { background: var(--white); width: 100%; max-width: 800px; padding: 30px; border-radius: var(--radius-lg); max-height: 90vh; overflow-y: auto; position: relative; }

        .admin-panel { background: #fff; border: 2px solid var(--dark); border-radius: var(--radius-lg); padding: 25px; margin: 30px 0; display: none; }
        .admin-panel.visible { display: block; }
        .form-input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 10px; border: 1px solid var(--border); font-size: 16px; }

        #notification { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(150px); background: var(--dark); color: white; padding: 12px 30px; border-radius: 99px; z-index: 3000; transition: var(--transition); }
        .wa-float { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: #25D366; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; z-index: 900; box-shadow: 0 10px 30px rgba(37,211,102,0.4); text-decoration: none; }

        /* CHATBOT */
        .chatbot-toggle { position: fixed; bottom: 100px; right: 25px; width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; z-index: 900; box-shadow: 0 10px 30px rgba(142, 68, 173, 0.4); cursor: pointer; border: none; }
        .chatbot-container { position: fixed; bottom: 170px; right: 25px; width: 320px; height: 450px; background: white; border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.2); z-index: 899; display: none; flex-direction: column; overflow: hidden; border: 3px solid var(--primary); }
        .chatbot-container.active { display: flex; }
        .chatbot-header { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .chatbot-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .chatbot-input { display: flex; padding: 15px; border-top: 1px solid var(--border); gap: 10px; }
        .chatbot-input input { flex: 1; padding: 12px 15px; border: 1px solid var(--border); border-radius: 25px; font-size: 0.9rem; outline: none; }
        .chatbot-input button { background: var(--primary); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .bot-msg { background: var(--slate-100); padding: 10px; border-radius: 12px; align-self: flex-start; max-width: 85%; font-size: 0.85rem; }
        .user-msg { background: var(--primary); color: white; padding: 10px; border-radius: 12px; align-self: flex-end; max-width: 85%; font-size: 0.85rem; }

        /* SHARE */
        .share-float { position: fixed; bottom: 25px; left: 25px; width: 60px; height: 60px; background: linear-gradient(45deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; z-index: 900; box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); cursor: pointer; border: none; }
        .share-container { position: fixed; bottom: 100px; left: 25px; background: white; border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.2); z-index: 899; display: none; flex-direction: column; overflow: hidden; border: 3px solid var(--primary); width: 280px; }
        .share-container.active { display: flex; }
        .share-header { background: var(--primary); color: white; padding: 15px 20px; font-weight: 700; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <svg class="logo-svg" viewBox="0 0 450 100" fill="none">
                <circle cx="210" cy="35" r="28" fill="#8e44ad"/>
                <text x="10" y="88" font-family="Inter" font-weight="800" font-size="48" fill="#222">COLCHONETAS</text>
            </svg>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="cat-btn" onclick="toggleCart()" style="background: var(--dark); color: white;">
                    <i class="fas fa-shopping-bag"></i> <span id="header-cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero-banner"><div class="stars"></div></section>

        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="product-search" class="search-input" placeholder="Buscar productos..." oninput="handleSearch()">
        </div>

        <div class="category-nav" id="categories-container"></div>
        <div class="bento-grid" id="products-container"></div>

        <div style="text-align: center; margin: 40px 0;">
            <button class="cat-btn" onclick="checkAdminAccess()">Acceso Administración</button>
        </div>

        <section class="admin-panel" id="admin-panel">
            <h3>Panel de Control</h3>
            <div style="margin-top:15px;">
                <label style="font-size:0.8rem; font-weight:700;">URL Google Sheets:</label>
                <input type="text" id="excel-url" class="form-input" placeholder="URL Google Sheets">
                <button class="cat-btn active" style="margin-top:15px; width:100%;" onclick="syncWithExcel()">Actualizar Datos</button>
            </div>
            <div id="visitor-data" style="margin-top:20px; padding:15px; background:#f8fafc; border-radius:12px;"></div>
            <div id="sales-data" style="margin-top:20px;"></div>
        </section>
    </main>

    <!-- CARRITO -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="font-weight: 800;">Tu Carrito</h2>
            <button onclick="toggleCart()" style="background:none; border:none; font-size:2rem; cursor:pointer;">&times;</button>
        </div>
        <div id="cart-items" style="flex:1; overflow-y:auto; margin-top:20px;"></div>
        
        <div style="background:var(--slate-100); padding:15px; border-radius:15px; margin-top:20px;">
            <input type="text" id="customer-name" class="form-input" placeholder="Tu Nombre">
            <input type="text" id="shipping-cp" class="form-input" placeholder="Código Postal">
            <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1.4rem; margin-top:15px;">
                <span>Total</span><span id="cart-total">$0</span>
            </div>
            <button class="cat-btn active" style="width:100%; padding:18px; margin-top:15px;" onclick="checkoutViaWhatsApp()">Enviar Pedido</button>
        </div>
    </div>

    <!-- MODAL DETALLE -->
    <div class="modal" id="detail-modal">
        <div class="modal-content">
            <span onclick="closeModal('detail-modal')" style="position:absolute; top:15px; right:20px; font-size:2rem; cursor:pointer;">&times;</span>
            <div id="detail-content"></div>
        </div>
    </div>

    <!-- CHATBOT -->
    <button class="chatbot-toggle" onclick="toggleChatbot()"><i class="fas fa-robot"></i></button>
    <div class="chatbot-container" id="chatbot-container">
        <div class="chatbot-header"><h3>Asistente Mundo Colchonetas</h3></div>
        <div class="chatbot-messages" id="chatbot-messages"></div>
        <div class="chatbot-input">
            <input type="text" id="chatbot-input" placeholder="Tengo una duda..." onkeypress="if(event.key==='Enter') sendChatbotMessage()">
            <button onclick="sendChatbotMessage()">></button>
        </div>
    </div>

    <!-- COMPARTIR -->
    <button class="share-float" onclick="toggleShare()"><i class="fas fa-share-alt"></i></button>
    <div class="share-container" id="share-container">
        <div class="share-header">¡Comparte el catálogo!</div>
        <div style="padding:20px; text-align:center;"><button class="cat-btn active" onclick="copyLink()">Copiar Link</button></div>
    </div>

    <div id="notification">¡Añadido!</div>
    <a href="https://wa.me/5491168705261" class="wa-float" target="_blank"><i class="fab fa-whatsapp"></i></a>

    <script>
        const CONFIG = {
            ADMIN: { user: "admin", pass: "mundo123" },
            KEY: "mundo_colch_vFinal",
            SALES_KEY: "mundo_colchonetas_ventas",
            VISITORS_KEY: "mundo_colchonetas_visitors",
            MASTER_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQX_MteY9z1Of-MIimoruabnLSCY2p1mMDl0RvYeDWivYTfXljryTikNsCGM3yFdF-PcoWo2Zyb5EiS/pub?gid=0&single=true&output=csv",
            // --- PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT ---
            SALES_SHEET_URL: "https://script.google.com/macros/s/AKfycbwh4STHilBmBF0B_9X-yGvbc2w7_Es0ZId3X5h8I9G5468T9PObZDiFJwaqYOdU72z9_w/exec" 
        };

        const SHIPPING_RATES = { "1629": 8000, "1635": 8000, "1669": 10000 };
        let products = [], cart = [], currentCategory = 'todos', isAdminLoggedIn = false, shippingFee = 0, searchQuery = "";
        const norm = (str) => str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase() : "";

        // REGISTRO DE VENTA (Sincronizado con Sheets)
        function registerSale(customerName, cp) {
            const totalAmount = cart.reduce((acc, item) => acc + ((item.oferta ? item.precioOferta : item.precio) * item.qty), 0) + shippingFee;
            const itemsList = cart.map(item => `${item.nombre} (x${item.qty})`).join(", ");
            const sale = { date: new Date().toLocaleString('es-AR'), customerName, postalCode: cp, items: itemsList, total: `$${totalAmount.toLocaleString()}` };

            if (CONFIG.SALES_SHEET_URL !== "https://script.google.com/macros/s/AKfycbwh4STHilBmBF0B_9X-yGvbc2w7_Es0ZId3X5h8I9G5468T9PObZDiFJwaqYOdU72z9_w/exec") {
                fetch(CONFIG.SALES_SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(sale) });
            }

            let history = JSON.parse(localStorage.getItem(CONFIG.SALES_KEY)) || [];
            history.push(sale);
            localStorage.setItem(CONFIG.SALES_KEY, JSON.stringify(history));
            cart = []; updateCartUI();
        }

        // VISITAS
        function trackVisitor() {
            let data = JSON.parse(localStorage.getItem(CONFIG.VISITORS_KEY)) || { total: 0, today: 0 };
            data.total++; data.today++;
            localStorage.setItem(CONFIG.VISITORS_KEY, JSON.stringify(data));
            if(isAdminLoggedIn) showVisitorStats();
        }

        // CORE LOGIC
        async function syncWithExcel(silent = false) {
            try {
                const res = await fetch(CONFIG.MASTER_URL + `?cache=${Date.now()}`);
                const text = await res.text();
                const rows = text.split('\n').slice(1);
                products = rows.map(r => {
                    const c = r.split(','); if(c.length < 6) return null;
                    const pBase = parseFloat(c[5]) || 0; const desc = parseFloat(c[10]) || 0;
                    return { clave: c[0], nombre: c[2], stock: c[3], precio: pBase, categoria: c[7], descripcion: c[8], oferta: c[9]==='SI', precioOferta: Math.round(pBase*(1-desc/100)), fotos: c[11]?c[11].split(','):[] };
                }).filter(p => p);
                localStorage.setItem(CONFIG.KEY, JSON.stringify(products)); renderAll();
            } catch (e) { if(!silent) alert("Error Sync"); }
        }

        function renderAll() {
            const cats = ['todos', ...new Set(products.map(p => p.categoria.toLowerCase()))];
            document.getElementById('categories-container').innerHTML = cats.map(c => `<button class="cat-btn ${currentCategory===c?'active':''}" onclick="filterCat('${c}')">${c.toUpperCase()}</button>`).join('');
            renderProducts();
        }

        function filterCat(c) { currentCategory = c; renderAll(); }
        function handleSearch() { searchQuery = norm(document.getElementById('product-search').value); renderProducts(); }

        function renderProducts() {
            const container = document.getElementById('products-container');
            let filtered = products.filter(p => currentCategory==='todos' || p.categoria.toLowerCase()===currentCategory);
            if (searchQuery) filtered = filtered.filter(p => norm(p.nombre).includes(searchQuery));
            container.innerHTML = filtered.map(p => `<div class="product-card" onclick="openDetail('${p.clave}')"><div class="product-image-container"><img src="${p.fotos[0]}"></div><h3>${p.nombre}</h3><div style="display:flex; justify-content:space-between; align-items:center;"><b>$${(p.oferta?p.precioOferta:p.precio).toLocaleString()}</b><div class="btn-add-circle" onclick="event.stopPropagation(); addToCart('${p.clave}')">+</div></div></div>`).join('');
        }

        function openDetail(clave) {
            const p = products.find(i => i.clave === clave); if(!p) return;
            document.getElementById('detail-content').innerHTML = `<div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;"><div><img src="${p.fotos[0]}" style="width:100%; border-radius:15px;"></div><div><h2>${p.nombre}</h2><p style="margin:15px 0;">${p.descripcion}</p><button class="cat-btn active" onclick="addToCart('${p.clave}')">Añadir al Carrito</button></div></div>`;
            document.getElementById('detail-modal').classList.add('active');
        }

        function addToCart(clave) {
            const p = products.find(i => i.clave === clave); const exist = cart.find(i => i.clave === clave);
            if(exist) exist.qty++; else cart.push({...p, qty: 1});
            updateCartUI(); showNotify("¡Añadido!");
        }

        function updateCartUI() {
            let sub = 0;
            document.getElementById('cart-items').innerHTML = cart.map(item => {
                const p = item.oferta ? item.precioOferta : item.precio; sub += p * item.qty;
                return `<div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>${item.nombre} x${item.qty}</span><b>$${(p * item.qty).toLocaleString()}</b></div>`;
            }).join('');
            document.getElementById('cart-total').innerText = `$${(sub + shippingFee).toLocaleString()}`;
            document.getElementById('header-cart-count').innerText = cart.length;
        }

        function checkoutViaWhatsApp() {
            const name = document.getElementById('customer-name').value;
            const cp = document.getElementById('shipping-cp').value;
            if(!name) return alert("Ingresa tu nombre");
            let msg = `Pedido de ${name} (CP: ${cp})\n`;
            cart.forEach(i => msg += `- ${i.nombre} x${i.qty}\n`);
            msg += `Total: ${document.getElementById('cart-total').innerText}`;
            registerSale(name, cp);
            window.open(`https://wa.me/5491168705261?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function showNotify(msg) { const n = document.getElementById('notification'); n.innerText = msg; n.style.transform = "translateX(-50%) translateY(0)"; setTimeout(() => n.style.transform = "translateX(-50%) translateY(150px)", 2000); }
        function checkAdminAccess() { const p = prompt("Contraseña"); if(p === CONFIG.ADMIN.pass) { isAdminLoggedIn = true; document.getElementById('admin-panel').classList.add('visible'); showVisitorStats(); } }
        function login() { /* (Login logic) */ }
        function toggleChatbot() { document.getElementById('chatbot-container').classList.toggle('active'); }
        function sendChatbotMessage() {
            const input = document.getElementById('chatbot-input'); const msg = input.value.trim(); if(!msg) return;
            const container = document.getElementById('chatbot-messages');
            container.innerHTML += `<div class="user-msg">${msg}</div><div class="bot-msg">Estamos para ayudarte. Consultanos por envíos o talles.</div>`;
            input.value = ""; container.scrollTop = container.scrollHeight;
        }
        function toggleShare() { document.getElementById('share-container').classList.toggle('active'); }
        function copyLink() { navigator.clipboard.writeText(window.location.href); showNotify("Copiado"); }

        window.addEventListener('DOMContentLoaded', () => { trackVisitor(); syncWithExcel(true); });
    </script>
</body>
</html>
